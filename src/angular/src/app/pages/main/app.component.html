<nav id="top-nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <span class="brand-text">SeedSync</span>
      <span class="brand-version">v{{version}}</span>
    </div>
    <div class="nav-links">
      @for (routeInfo of routeInfos; track routeInfo.path) {
        <a
          class="nav-link"
          routerLink="{{routeInfo.path}}"
          routerLinkActive="active">
          {{routeInfo.name}}
        </a>
      }
    </div>
  </div>
</nav>

<div id="top-content">
  <div id="top-header">
    <div #topHeader>
      <app-header></app-header>
    </div>
  </div>

  <router-outlet></router-outlet>
</div>

<!-- Toast notifications -->
@if (toasts.length > 0) {
  <div class="toast-container position-fixed top-0 end-0 p-3">
    @for (toast of toasts; track toast.message) {
      <div
        class="toast show"
         [ngClass]="{
            'bg-success text-white': toast.type === 'success',
            'bg-info text-dark': toast.type === 'info',
            'bg-warning text-dark': toast.type === 'warning',
            'bg-danger text-white': toast.type === 'danger'
         }"
        role="alert"
        aria-live="assertive"
        aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            {{toast.message}}
          </div>
          <button type="button" class="btn-close me-2 m-auto"
            [ngClass]="{'btn-close-white': toast.type === 'success' || toast.type === 'danger'}"
            (click)="dismissToast(toast)"
            aria-label="Close">
          </button>
        </div>
      </div>
    }
  </div>
}
